name: Autorizar TikTok
on:
  workflow_dispatch:
    inputs:
      codigo: { description: "Codigo de autorizacion que muestra la pagina de retorno", required: true }
permissions:
  contents: write
jobs:
  autorizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canjear codigo
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_STATE_KEY: ${{ secrets.TIKTOK_STATE_KEY }}
        run: python3 tiktok.py auth "${{ inputs.codigo }}"
      - name: Guardar
        run: |
          git config user.name "publicador"; git config user.email "publicador@users.noreply.github.com"
          git add tiktok_token.enc; git commit -m "Autorizacion de TikTok"; git pull --rebase -q; git push
